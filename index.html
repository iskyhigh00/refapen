<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fallas MDA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#2d3748;
  --txt:#e6edf3; --muted:#8b949e;
  --accent:#2f81f7; --accent2:#1f6feb;
  --ok:#2ea043; --warn:#d29922; --danger:#da3633;
  --old1:#3fb950; --old2:#d29922; --old3:#da3633;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;overflow-x:hidden;}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px;}
header h1{font-size:18px;font-weight:700;letter-spacing:.5px;margin-right:auto}
.tecnico-badge{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;background:var(--panel2);padding:5px 10px;border-radius:20px;border:1px solid var(--border);cursor:pointer;}
.tecnico-badge b{color:var(--accent)}
.offline-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.offline-dot.off{background:var(--danger)}
.sync-pill{font-size:11px;color:var(--warn)}
main{padding:14px 14px 100px;max-width:680px;margin:0 auto}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:480px;margin:0 auto;}
.login h2{font-size:24px;margin-bottom:4px}
.login p{color:var(--muted);margin-bottom:24px}
.tec-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tec-btn{background:var(--panel);border:1px solid var(--border);color:var(--txt);padding:18px 12px;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;transition:.15s;}
.tec-btn:active{background:var(--accent);border-color:var(--accent);transform:scale(.97)}
.empty{text-align:center;color:var(--muted);padding:48px 16px}
.mda-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;cursor:pointer;transition:.15s;}
.mda-card:active{transform:scale(.99)}
.mda-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.mda-id{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.mda-isla{color:var(--muted);font-size:14px;font-weight:500}
.mda-count{background:var(--panel2);border-radius:20px;padding:4px 12px;font-size:13px;font-weight:600;white-space:nowrap;border:1px solid var(--border);}
.fallas-mini{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.falla-mini{font-size:14px;padding:8px 0;border-top:1px solid var(--border);}
.falla-mini-top{display:flex;align-items:center;gap:8px;width:100%}
.ult-accion{font-size:12px;color:var(--muted);margin-left:18px;margin-top:2px}
.est-seg{display:flex;gap:0;border-radius:8px;overflow:hidden;border:1px solid var(--border);margin-left:18px;margin-top:6px}
.est-seg button{flex:1;background:var(--panel2);border:none;color:var(--muted);padding:7px 6px;font-size:12px;font-weight:600;cursor:pointer}
.est-seg button.on[data-e="pendiente"]{background:var(--warn);color:#000}
.est-seg button.on[data-e="observacion"]{background:var(--accent);color:#fff}
.est-seg button.on[data-e="resuelta"]{background:var(--ok);color:#fff}
.age-dot{width:10px;height:10px;border-radius:50%;flex:none}
.age-0{background:var(--old1)}.age-1{background:var(--old2)}.age-2{background:var(--old3)}
.age-dot.obs{background:var(--accent)}
.falla-txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.falla-age{font-size:12px;color:var(--muted);white-space:nowrap}
.volvio-btn{margin-left:18px;margin-top:6px;background:var(--danger);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;width:calc(100% - 18px)}
.fab{position:fixed;bottom:20px;right:20px;z-index:20;background:var(--accent);color:#fff;border:none;width:60px;height:60px;border-radius:50%;font-size:32px;cursor:pointer;box-shadow:0 4px 16px rgba(47,129,247,.5);display:flex;align-items:center;justify-content:center;}
.fab:active{transform:scale(.92)}
.screen{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding-bottom:40px;}
.screen-head{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px;}
.back-btn{background:none;border:none;color:var(--accent);font-size:16px;cursor:pointer;padding:6px;display:flex;align-items:center;gap:4px}
.screen-head h2{font-size:17px;flex:1}
.screen-body{padding:16px;max-width:680px;margin:0 auto}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:600}
input,textarea,select{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--txt);padding:13px;border-radius:10px;font-size:16px;font-family:inherit;}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}
.btn{width:100%;background:var(--accent);color:#fff;border:none;padding:15px;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-top:20px;}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5}
.btn-sec{background:var(--panel2);border:1px solid var(--border);color:var(--txt)}
.btn-ok{background:var(--ok)}
.btn-sm{padding:8px 14px;font-size:13px;margin-top:8px;width:auto}
.btn-danger{background:var(--danger)}
.seg{display:flex;gap:0;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.seg button{flex:1;background:var(--panel2);border:none;color:var(--muted);padding:12px 4px;font-size:14px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.seg.res button.on[data-v="resolvio"]{background:var(--ok)}
.seg.res button.on[data-v="no_resolvio"]{background:var(--danger)}
.seg.res button.on[data-v="pendiente"]{background:var(--warn);color:#000}
.falla-detalle{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px}
.falla-detalle h3{font-size:16px;margin-bottom:4px}
.meta{font-size:12px;color:var(--muted);margin-bottom:12px}
.estado-tag{display:inline-block;padding:2px 10px;border-radius:6px;font-size:12px;font-weight:700}
.estado-pendiente{background:var(--warn);color:#000}
.estado-observacion{background:var(--accent);color:#fff}
.estado-resuelta{background:var(--ok);color:#fff}
.accion-item{border-top:1px solid var(--border);padding:10px 0;font-size:14px}
.accion-item.anulada{opacity:.5}
.accion-item.anulada .a-head span:first-child{text-decoration:line-through}
.a-head{display:flex;justify-content:space-between;gap:8px;margin-bottom:2px}
.res-tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:4px;white-space:nowrap}
.res-resolvio{background:var(--ok);color:#fff}.res-no_resolvio{background:var(--danger);color:#fff}.res-pendiente{background:var(--warn);color:#000}
.accion-meta{font-size:11px;color:var(--muted)}
.accion-hist{font-size:11px;color:var(--muted);margin-top:3px;padding-left:8px;border-left:2px solid var(--border)}
.add-accion{background:var(--panel2);border:1px dashed var(--border);border-radius:10px;padding:14px;margin-top:12px}
.reg-arriba{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{background:var(--panel2);border:1px solid var(--border);color:var(--txt);padding:8px 12px;border-radius:18px;font-size:13px;cursor:pointer}
.chip.fav{border-color:var(--accent2)}
.cat-block{border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden}
.cat-head{background:var(--panel2);padding:11px 14px;font-size:14px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.cat-head .arr{color:var(--muted);transition:.2s}
.cat-head.open .arr{transform:rotate(90deg)}
.cat-items{display:none;padding:4px}
.cat-items.open{display:block}
.cat-item{padding:11px 12px;font-size:14px;cursor:pointer;border-radius:8px}
.cat-item:active{background:var(--accent)}
.sel-accion{background:transparent;padding:0;border-radius:0;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:6px}
.acc-tag{background:var(--accent);color:#fff;padding:7px 10px;border-radius:8px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.acc-tag .x{cursor:pointer;font-weight:700;font-size:16px}
.no-res{color:var(--muted);font-size:13px;text-align:center;padding:12px}
.add-nueva-acc{background:var(--panel2);border:1px dashed var(--accent2);color:var(--accent);padding:10px 14px;border-radius:8px;font-size:13px;cursor:pointer;width:100%;text-align:left;margin-top:6px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border);padding:12px 20px;border-radius:10px;z-index:50;font-size:14px;box-shadow:0 4px 20px rgba(0,0,0,.5)}
/* Admin */
.admin-section{margin-bottom:24px}
.admin-section h3{font-size:15px;font-weight:700;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.admin-item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.admin-item span{flex:1}
.admin-item input{padding:8px;font-size:14px;margin:0}
.btn-icon{background:none;border:none;cursor:pointer;padding:4px 8px;border-radius:6px;font-size:16px}
.btn-edit{color:var(--accent)}
.btn-del{color:var(--danger)}
.cat-select{margin-bottom:8px}
</style>
</head>
<body>

<div id="login" class="login">
  <h2>Fallas MDA</h2>
  <p>¿Quién eres?</p>
  <div class="tec-grid" id="tecGrid"></div>
</div>

<div id="app" class="hidden">
  <header>
    <h1>FALLAS MDA</h1>
    <button id="btnHist" style="background:var(--panel2);border:1px solid var(--border);color:var(--txt);padding:7px 12px;border-radius:8px;font-size:13px;cursor:pointer">Historial</button>
    <button id="btnAdmin" style="background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:7px 12px;border-radius:8px;font-size:13px;cursor:pointer">Admin</button>
    <div class="tecnico-badge" id="badgeTec">
      <span class="offline-dot" id="netDot"></span>
      <b id="tecNombre"></b>
      <span id="syncPill" class="sync-pill"></span>
      <span style="color:var(--muted);font-size:11px">▾</span>
    </div>
  </header>
  <main><div id="lista"></div></main>
  <button class="fab" id="fabNueva">+</button>
</div>

<!-- NUEVA FALLA -->
<div id="scrNueva" class="screen hidden">
  <div class="screen-head">
    <button class="back-btn" data-close="scrNueva">‹ Volver</button>
    <h2>Nueva falla</h2>
  </div>
  <div class="screen-body">
    <label>MDA (6 dígitos)</label>
    <input id="nMda" inputmode="numeric" maxlength="6" placeholder="100234">
    <label>Isla</label>
    <input id="nIsla" inputmode="numeric" placeholder="045">
    <label>Descripción de la falla</label>
    <textarea id="nFalla" placeholder="pérdida de imagen en pantalla superior"></textarea>
    <button class="btn" id="guardarFalla">Crear falla</button>
  </div>
</div>

<!-- HISTORIAL -->
<div id="scrHist" class="screen hidden">
  <div class="screen-head">
    <button class="back-btn" data-close="scrHist">‹ Volver</button>
    <h2>Historial de resueltas</h2>
  </div>
  <div class="screen-body" id="histBody"></div>
</div>

<!-- DETALLE MDA -->
<div id="scrMda" class="screen hidden">
  <div class="screen-head">
    <button class="back-btn" data-close="scrMda">‹ Volver</button>
    <h2 id="mdaTitulo"></h2>
  </div>
  <div class="screen-body" id="mdaBody"></div>
</div>

<!-- OBRIST -->
<div id="scrObrist" class="screen hidden">
  <div class="screen-head">
    <button class="back-btn" data-close="scrObrist">‹ Volver</button>
    <h2>⚡ Panel Obrist</h2>
  </div>
  <div class="screen-body" id="obristBody"></div>
</div>

<!-- ADMIN -->
<div id="scrAdmin" class="screen hidden">
  <div class="screen-head">
    <button class="back-btn" data-close="scrAdmin">‹ Volver</button>
    <h2>Admin</h2>
  </div>
  <div class="screen-body" id="adminBody"></div>
</div>

<script>
const SUPABASE_URL="https://wtwjerifitaeuaeaevqv.supabase.co";
const SUPABASE_KEY="sb_publishable_PPNkj3XLkbOObCOe-YjVQw_rn7xldec";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

// estado global
let tecnico=localStorage.getItem("tecnico_fallas")||null;
let isObrist=tecnico?.toLowerCase()==="obrist";
let TECNICOS=[];
let ACCIONES={};
let TODAS=[];
let FAVS=["Revisión visual de cableado","Revisión de conectores","Reapretar conectores de CPU","Intercambio cruzado de fuente","Cambio de fuente de poder","Reinicio simple (giro de llave auditoría)","RAM Clear","Reconexión de cable de comunicación"];

// util
const $=id=>document.getElementById(id);
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}
function diasDesde(iso){return Math.floor((Date.now()-new Date(iso))/86400000);}
function ageClass(d){return d>=3?"age-2":d>=1?"age-1":"age-0";}
function ageTxt(d){return d===0?"hoy":d===1?"1 día":d+" días";}
function fmtFecha(iso){const d=new Date(iso);return d.toLocaleDateString("es-CL")+" "+d.toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"});}
function mda6(v){v=v.replace(/\D/g,"");if(v.length===3)return"100"+v;if(v.length===4)return"10"+v;return v.padStart(6,"0").slice(-6);}
function esc(s){return(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function claveHora(){const n=new Date();return String(n.getHours()).padStart(2,"0")+String(n.getMinutes()).padStart(2,"0");}

// auditoría
async function audit(accion,detalle){
  if(!tecnico)return;
  try{await sb.from("auditoria").insert({tecnico,accion,detalle,created_at:new Date().toISOString()});}catch(e){}
}

// cargar datos maestros
async function cargarMaestros(){
  const[{data:tecs},{data:cats}]=await Promise.all([
    sb.from("tecnicos").select("*").eq("activo",true).order("nombre"),
    sb.from("catalogo_acciones").select("*").eq("activa",true).order("categoria").order("accion")
  ]);
  TECNICOS=(tecs||[]).map(t=>t.nombre);
  ACCIONES={};
  (cats||[]).forEach(c=>{
    if(!ACCIONES[c.categoria])ACCIONES[c.categoria]=[];
    ACCIONES[c.categoria].push(c.accion);
  });
  TODAS=Object.values(ACCIONES).flat();
}

// ---- red / cola offline ----
let cola=JSON.parse(localStorage.getItem("cola_fallas")||"[]");
function guardarCola(){localStorage.setItem("cola_fallas",JSON.stringify(cola));pintarSync();}
function pintarSync(){
  const on=navigator.onLine;
  $("netDot").className="offline-dot"+(on?"":" off");
  $("syncPill").textContent=cola.length?("• "+cola.length+" sin sincronizar"):"";
}
window.addEventListener("online",()=>{pintarSync();sincronizar();});
window.addEventListener("offline",pintarSync);
async function sincronizar(){
  if(!navigator.onLine||!cola.length)return;
  const pendientes=[...cola];cola=[];guardarCola();
  for(const op of pendientes){
    try{
      if(op.t==="falla"){const{error}=await sb.from("mdas_fallas").insert(op.d);if(error)throw error;}
      else if(op.t==="accion"){const{error}=await sb.from("acciones").insert(op.d);if(error)throw error;}
      else if(op.t==="estado"){const{error}=await sb.from("mdas_fallas").update({estado:op.d.estado,updated_at:new Date().toISOString()}).eq("id",op.d.id);if(error)throw error;}
    }catch(e){cola.push(op);}
  }
  guardarCola();cargarLista();
}

// ---- LOGIN ----
// bloqueo Obrist
function mostrarObrist(){
  const overlay=document.createElement("div");
  overlay.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center";
  const SEQ=[2,0,4,1,3]; // índices 0-based: botón 3,1,5,2,4
  let prog=0;
  let timer=null;
  function resetProg(){
    prog=0;
    clearTimeout(timer);
    dots.querySelectorAll("div[data-i]").forEach(x=>x.style.background="var(--border)");
  }
  overlay.innerHTML=`
    <div style="font-size:48px;margin-bottom:16px">🚫</div>
    <div style="font-size:22px;font-weight:700;margin-bottom:8px">noo.. usted no es obrist, váyase.</div>
    <div style="font-size:14px;color:var(--muted);margin-bottom:40px">Este usuario no existe en este casino.</div>
    <div id="obristDots" style="display:flex;gap:20px;margin-bottom:32px"></div>
    <button style="background:none;border:1px solid var(--border);color:var(--muted);padding:10px 24px;border-radius:8px;cursor:pointer;font-size:14px" id="obristCerrar">Entendido</button>`;
  document.body.appendChild(overlay);
  const dots=overlay.querySelector("#obristDots");
  for(let i=0;i<5;i++){
    const d=document.createElement("div");
    d.style.cssText="width:22px;height:22px;border-radius:50%;background:var(--border);cursor:pointer;transition:.2s";
    d.dataset.i=i;
    d.onclick=()=>{
      if(SEQ[prog]===i){
        if(prog===0){
          timer=setTimeout(()=>{resetProg();},3000);
        }
        prog++;
        if(prog===SEQ.length){
          clearTimeout(timer);
          // secuencia completa
          dots.innerHTML='<div style="font-size:28px">✓</div>';
          setTimeout(()=>{
            overlay.remove();
            const t="Obrist";
            tecnico=t;isObrist=true;localStorage.setItem("tecnico_fallas",t);
            audit("login",{tecnico:t});
            iniciar();
          },600);
        }
      }else{
        resetProg();
      }
    };
    dots.appendChild(d);
  }
  overlay.querySelector("#obristCerrar").onclick=()=>overlay.remove();
}

async function pintarLogin(){
  await cargarMaestros();
  $("tecGrid").innerHTML="";
  TECNICOS.forEach(t=>{
    const b=document.createElement("button");b.className="tec-btn";b.textContent=t;
    b.onclick=()=>{
      if(t.toLowerCase()==="obrist"){
        mostrarObrist();return;
      }
      tecnico=t;isObrist=t.toLowerCase()==="obrist";localStorage.setItem("tecnico_fallas",t);
      audit("login",{tecnico:t});
      iniciar();
    };
    $("tecGrid").appendChild(b);
  });
}
async function iniciar(){
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("tecNombre").textContent=tecnico;
  // mostrar botón Obrist solo para él
  if(isObrist){
    const btn=document.createElement("button");
    btn.id="btnObrist";btn.textContent="⚡ Obrist";
    btn.style.cssText="background:var(--danger);border:none;color:#fff;padding:7px 12px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:700";
    btn.onclick=()=>{$("scrObrist").classList.remove("hidden");cargarObrist();};
    $("btnAdmin").insertAdjacentElement("beforebegin",btn);
  }
  pintarSync();sincronizar();
  await cargarMaestros();
  cargarLista();
}

// ---- LISTA ----
async function cargarLista(){
  let fallas=[];
  if(navigator.onLine){
    const{data,error}=await sb.from("mdas_fallas").select("*").in("estado",["pendiente","observacion"]).order("updated_at",{ascending:true});
    if(!error&&data){fallas=data;localStorage.setItem("cache_fallas",JSON.stringify(data));}
    else fallas=JSON.parse(localStorage.getItem("cache_fallas")||"[]");
  }else{
    fallas=JSON.parse(localStorage.getItem("cache_fallas")||"[]").filter(f=>f.estado==="pendiente"||f.estado==="observacion");
  }
  const ultAcc={};
  if(navigator.onLine&&fallas.length){
    const ids=fallas.map(f=>f.id);
    const{data:accs}=await sb.from("acciones").select("falla_id,accion,resultado,created_at,anulada").in("falla_id",ids).order("created_at",{ascending:false});
    (accs||[]).forEach(a=>{if(!a.anulada&&!ultAcc[a.falla_id])ultAcc[a.falla_id]=a;});
  }
  const grupos={};
  fallas.forEach(f=>{(grupos[f.mda]=grupos[f.mda]||{mda:f.mda,isla:f.isla,fallas:[]}).fallas.push(f);});
  const arr=Object.values(grupos);
  arr.forEach(g=>g.fallas.sort((a,b)=>new Date(a.updated_at)-new Date(b.updated_at)));
  arr.sort((a,b)=>new Date(a.fallas[0].updated_at)-new Date(b.fallas[0].updated_at));
  const cont=$("lista");
  if(!arr.length){cont.innerHTML='<div class="empty"><p style="color:var(--muted)">Sin fallas pendientes ✓</p></div>';return;}
  cont.innerHTML="";
  arr.forEach(g=>{
    const card=document.createElement("div");card.className="mda-card";

    const head=document.createElement("div");head.className="mda-head";
    head.innerHTML=`<div><span class="mda-id">MDA ${g.mda}</span> <span class="mda-isla">isla ${g.isla}</span></div><span class="mda-count">${g.fallas.length} ${g.fallas.length===1?"falla":"fallas"}</span>`;
    card.appendChild(head);
    const mini=document.createElement("div");mini.className="fallas-mini";
    g.fallas.forEach(f=>{
      const d=diasDesde(f.updated_at);
      const acc=ultAcc[f.id];
      const fila=document.createElement("div");fila.className="falla-mini";
      fila.innerHTML=`
        <div class="falla-mini-top">
          <span class="age-dot ${f.estado==='observacion'?'obs':ageClass(d)}"></span>
          <span class="falla-txt">${esc(f.falla)}</span>
          <span class="falla-age">${ageTxt(d)}</span>
        </div>
        ${acc?`<div class="ult-accion">Última: ${esc(acc.accion)} · ${acc.resultado==="resolvio"?"resolvió":acc.resultado==="no_resolvio"?"no resolvió":"pendiente"}</div>`:`<div class="ult-accion">Sin acciones aún</div>`}
        <div class="est-seg" data-est="${f.id}">
          <button data-e="pendiente" class="${f.estado==='pendiente'?'on':''}">Pendiente</button>
          <button data-e="observacion" class="${f.estado==='observacion'?'on':''}">En observación</button>
          <button data-e="resuelta">Resuelto</button>
        </div>
        ${f.estado==='observacion'?`<button class="volvio-btn" data-volvio="${f.id}">⟲ Volvió a fallar</button>`:''}`;
      mini.appendChild(fila);
      fila.querySelectorAll(".est-seg button").forEach(b=>{
        b.onclick=(ev)=>{ev.stopPropagation();cambiarEstadoPortada(f.id,b.dataset.e);};
      });
      fila.querySelector("[data-volvio='"+f.id+"']")?.addEventListener("click",(ev)=>{ev.stopPropagation();cambiarEstadoPortada(f.id,"pendiente");});
    });
    card.appendChild(mini);
    cont.appendChild(card);
  });
  // auditar apertura de portada
  audit("ver_portada",{total_fallas:fallas.length});
}

async function cambiarEstadoPortada(fallaId,estado){
  if(estado==="resuelta"){if(!confirm("¿Estái seguro? ¿Con váucher? 🧾"))return;}
  const upd={estado,updated_at:new Date().toISOString()};
  if(navigator.onLine){const{error}=await sb.from("mdas_fallas").update(upd).eq("id",fallaId);if(error){cola.push({t:"estado",d:{id:fallaId,estado}});guardarCola();}}
  else{cola.push({t:"estado",d:{id:fallaId,estado}});guardarCola();}
  audit("cambiar_estado",{falla_id:fallaId,estado});
  toast(estado==="resuelta"?"Resuelta":estado==="observacion"?"En observación":"Pendiente");
  cargarLista();
}

async function abrirMda(mdaNum){
  $("scrMda").classList.remove("hidden");
  $("mdaTitulo").textContent="MDA "+mdaNum;
  $("mdaBody").innerHTML="<p style='color:var(--muted)'>Cargando…</p>";
  audit("abrir_mda",{mda:mdaNum});
  let fallas=[];
  if(navigator.onLine){
    const{data}=await sb.from("mdas_fallas").select("*").eq("mda",mdaNum).order("created_at",{ascending:false});
    fallas=data||[];
  }else{
    fallas=JSON.parse(localStorage.getItem("cache_fallas")||"[]").filter(f=>f.mda===mdaNum);
  }
  const body=$("mdaBody");body.innerHTML="";

}

const accSel={};
function renderFalla(f,acciones){
  const div=document.createElement("div");div.className="falla-detalle";
  const cerrada=f.estado==="resuelta";
  const estLabel={pendiente:"Pendiente",observacion:"En observación",resuelta:"Resuelta"}[f.estado]||f.estado;
  let accHtml="";
  acciones.forEach(a=>{
    const hist=a.historial_resultados?`<div class="accion-hist">${esc(a.historial_resultados).split(" → ").map((h,i)=>`<div>${i+1}. ${h}</div>`).join("")}<div>${esc(a.historial_resultados).split(" → ").length+1}. ${a.resultado==="resolvio"?"resolvió":a.resultado==="no_resolvio"?"no resolvió":"pendiente"} (${a.tecnico} · ${fmtFecha(a.created_at)})</div></div>`:"";
    const clickable=(!a.anulada&&a.resultado==="pendiente")?`style="cursor:pointer" data-resolve="${a.id}" data-accion="${esc(a.accion)}"`:""
    accHtml+=`<div class="accion-item${a.anulada?' anulada':''}" ${clickable}><div class="a-head"><span>${esc(a.accion)}</span><span class="res-tag res-${a.resultado}">${a.resultado==="resolvio"?"resolvió":a.resultado==="no_resolvio"?"no resolvió":"pendiente"}</span></div><div class="accion-meta">${a.tecnico} · ${fmtFecha(a.created_at)}</div>${hist}</div>`;
  });
  div.innerHTML=`
    <h3>${esc(f.falla)}</h3>
    <div class="meta">${f.tecnico} · ${fmtFecha(f.created_at)} · <span class="estado-tag estado-${f.estado}">${estLabel}</span></div>
    <div class="acciones-list">${accHtml||'<p style="color:var(--muted);font-size:13px">Sin acciones aún.</p>'}</div>
    ${cerrada?"":`
    <div class="add-accion">
      <label style="margin-top:0">Registrar lo que hice</label>
      <div id="selacc-${f.id}" class="sel-accion hidden"></div>
      <div class="reg-arriba hidden" data-regarriba="${f.id}">
        <div class="seg res" data-resseg="${f.id}">
          <button class="on" data-v="resolvio">Resolvió</button>
          <button data-v="no_resolvio">No resolvió</button>
          <button data-v="pendiente">Pendiente</button>
        </div>
        <button class="btn btn-ok" data-addacc="${f.id}" style="margin-top:10px">Guardar acciones</button>
      </div>
      <input class="acc-search" placeholder="Buscar acción…" data-search="${f.id}" style="margin-bottom:10px">
      <div class="chips" data-chips="${f.id}"></div>
      <div data-cats="${f.id}"></div>
    </div>`}
  `;
  div.querySelectorAll(".seg.res").forEach(seg=>{
    seg.querySelectorAll("button").forEach(b=>b.onclick=()=>{seg.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");});
  });
  if(!cerrada)initSelectorAcciones(div,f.id,acciones);
  div.querySelector("[data-addacc='"+f.id+"']")?.addEventListener("click",()=>addAccion(f.id));
  // click en acción pendiente → resolver al toque
  div.querySelectorAll("[data-resolve]").forEach(el=>el.addEventListener("click",()=>{
    resolverAccionPendiente(el.dataset.resolve,el.dataset.accion,f.id);
  }));
  return div;
}

function initSelectorAcciones(div,fid,accionesExistentes){
  const chips=div.querySelector("[data-chips='"+fid+"']");
  const cats=div.querySelector("[data-cats='"+fid+"']");
  const search=div.querySelector("[data-search='"+fid+"']");
  const selBox=div.querySelector("#selacc-"+fid);
  const regArriba=div.querySelector("[data-regarriba='"+fid+"']");
  accSel[fid]=[];

  function render(){
    const sel=accSel[fid]||[];
    if(!sel.length){selBox.classList.add("hidden");regArriba.classList.add("hidden");return;}
    selBox.innerHTML=sel.map(a=>`<span class="acc-tag">${esc(a)}<span class="x" data-rm="${esc(a)}">×</span></span>`).join("");
    selBox.classList.remove("hidden");regArriba.classList.remove("hidden");
    selBox.querySelectorAll("[data-rm]").forEach(x=>x.onclick=()=>{accSel[fid]=accSel[fid].filter(a=>a!==x.dataset.rm);render();});
  }
  function elegir(acc){
    accSel[fid]=accSel[fid]||[];
    if(!accSel[fid].includes(acc))accSel[fid].push(acc);
    render();
    selBox.scrollIntoView({behavior:"smooth",block:"center"});
  }

  chips.innerHTML="";
  FAVS.forEach(a=>{
    if(!TODAS.includes(a))return;
    const c=document.createElement("button");c.className="chip fav";c.textContent=a;c.onclick=()=>elegir(a);chips.appendChild(c);
  });

  function pintarCats(filtro){
    cats.innerHTML="";
    const q=(filtro||"").toLowerCase().trim();
    if(q){
      const res=TODAS.filter(a=>a.toLowerCase().includes(q));
      if(!res.length){
        cats.innerHTML='<div class="no-res">Sin coincidencias</div>';
        // botón para agregar al catálogo
        const btn=document.createElement("button");
        btn.className="add-nueva-acc";
        btn.textContent=`+ Agregar "${filtro}" al catálogo`;
        btn.onclick=()=>agregarAlCatalogo(filtro,fid,elegir);
        cats.appendChild(btn);
        return;
      }
      const box=document.createElement("div");box.className="cat-items open";
      res.forEach(a=>{const it=document.createElement("div");it.className="cat-item";it.textContent=a;it.onclick=()=>elegir(a);box.appendChild(it);});
      cats.appendChild(box);return;
    }
    Object.entries(ACCIONES).forEach(([cat,items])=>{
      const block=document.createElement("div");block.className="cat-block";
      const head=document.createElement("div");head.className="cat-head";
      head.innerHTML=`<span>${cat}</span><span class="arr">›</span>`;
      const body=document.createElement("div");body.className="cat-items";
      items.forEach(a=>{const it=document.createElement("div");it.className="cat-item";it.textContent=a;it.onclick=()=>elegir(a);body.appendChild(it);});
      head.onclick=()=>{head.classList.toggle("open");body.classList.toggle("open");};
      block.appendChild(head);block.appendChild(body);cats.appendChild(block);
    });
  }
  pintarCats("");
  search.oninput=()=>pintarCats(search.value);
}

async function agregarAlCatalogo(nombre,fid,elegirFn){
  const cat=prompt("¿A qué categoría pertenece?\n"+Object.keys(ACCIONES).join("\n"));
  if(!cat||!Object.keys(ACCIONES).hasOwnProperty(cat)){toast("Categoría inválida");return;}
  const{error}=await sb.from("catalogo_acciones").insert({categoria:cat,accion:nombre,activa:true});
  if(error){toast("Error al agregar");return;}
  audit("agregar_accion_catalogo",{accion:nombre,categoria:cat});
  await cargarMaestros();
  elegirFn(nombre);
  toast("Agregado al catálogo");
}

async function addAccion(fallaId){
  const sel=accSel[fallaId]||[];
  if(!sel.length){toast("Elige al menos una acción");return;}
  const res=document.querySelector("[data-resseg='"+fallaId+"'] button.on").dataset.v;
  const ts=new Date().toISOString();
  let existentes=[];
  if(navigator.onLine){const{data}=await sb.from("acciones").select("*").eq("falla_id",fallaId);existentes=(data||[]).filter(a=>!a.anulada);}
  const resLabel={resolvio:"resolvió",no_resolvio:"no resolvió",pendiente:"pendiente"};
  for(const txt of sel){
    const prev=existentes.find(a=>a.accion===txt);
    if(prev&&navigator.onLine){
      const rastro=(prev.historial_resultados?prev.historial_resultados+" → ":"")+`${resLabel[prev.resultado]} (${prev.tecnico} · ${fmtFecha(prev.created_at)})`;
      const{error}=await sb.from("acciones").update({resultado:res,tecnico:tecnico,created_at:ts,historial_resultados:rastro}).eq("id",prev.id);
      if(error){cola.push({t:"accion",d:{falla_id:fallaId,accion:txt,resultado:res,tecnico:tecnico,created_at:ts}});guardarCola();}
    }else{
      const d={falla_id:fallaId,accion:txt,resultado:res,tecnico:tecnico,created_at:ts};
      if(navigator.onLine){const{error}=await sb.from("acciones").insert(d);if(error){cola.push({t:"accion",d});guardarCola();}}
      else{cola.push({t:"accion",d});guardarCola();}
    }
  }
  let nuevoEstado=null;
  if(res==="resolvio")nuevoEstado="observacion";
  else if(res==="no_resolvio")nuevoEstado="pendiente";
  const upd={updated_at:ts};
  if(nuevoEstado)upd.estado=nuevoEstado;
  if(navigator.onLine){await sb.from("mdas_fallas").update(upd).eq("id",fallaId);}
  else if(nuevoEstado){cola.push({t:"estado",d:{id:fallaId,estado:nuevoEstado}});guardarCola();}
  audit("registrar_acciones",{falla_id:fallaId,acciones:sel,resultado:res,nuevo_estado:nuevoEstado});
  accSel[fallaId]=[];
  toast(nuevoEstado==="observacion"?"Registrado · en observación":"Registrado");
  const mda=$("mdaTitulo").textContent.replace("MDA ","");
  abrirMda(mda);
}

function resolverAccionPendiente(accionId,nombre,fallaId){
  const overlay=document.createElement("div");
  overlay.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px";
  overlay.innerHTML=`
    <div style="background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;width:100%;max-width:360px">
      <div style="font-size:15px;font-weight:700;margin-bottom:4px">${esc(nombre)}</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:20px">¿Cómo quedó esta acción?</div>
      <button class="btn btn-ok" id="oRes" style="margin-top:0">✓ Resolvió</button>
      <button class="btn btn-danger" id="oNoRes" style="margin-top:10px">✗ No resolvió</button>
      <button class="btn btn-sec" id="oCancelar" style="margin-top:10px">Cancelar</button>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector("#oCancelar").onclick=()=>overlay.remove();
  overlay.onclick=(e)=>{if(e.target===overlay)overlay.remove();};
  async function aplicar(res){
    overlay.remove();
    const ts=new Date().toISOString();
    const prev={resultado:"pendiente",tecnico:tecnico,created_at:ts};
    const rastro=`pendiente (${tecnico} · ${fmtFecha(ts)})`;
    await sb.from("acciones").update({resultado:res,tecnico,created_at:ts,historial_resultados:rastro}).eq("id",accionId);
    let nuevoEstado=res==="resolvio"?"observacion":res==="no_resolvio"?"pendiente":null;
    if(nuevoEstado)await sb.from("mdas_fallas").update({estado:nuevoEstado,updated_at:ts}).eq("id",fallaId);
    audit("resolver_accion_pendiente",{accion_id:accionId,resultado:res,falla_id:fallaId});
    toast(nuevoEstado==="observacion"?"Resuelto · en observación":"Registrado");
    const mda=$("mdaTitulo").textContent.replace("MDA ","");
    abrirMda(mda);cargarLista();
  }
  overlay.querySelector("#oRes").onclick=()=>aplicar("resolvio");
  overlay.querySelector("#oNoRes").onclick=()=>aplicar("no_resolvio");
}

// ---- PANEL OBRIST ----
async function cargarObrist(){
  const body=$("obristBody");
  body.innerHTML='<p style="color:var(--muted)">Cargando…</p>';
  const{data:fallas}=await sb.from("mdas_fallas").select("*").order("created_at",{ascending:false});
  body.innerHTML="";

  // CARGA MASIVA
  const secMasiva=document.createElement("div");secMasiva.className="admin-section";
  secMasiva.innerHTML=`
    <h3>Carga masiva de fallas</h3>
    <p style="font-size:13px;color:var(--muted);margin-bottom:12px">CSV con columnas: <b>mda,isla</b> — separadas por coma, sin cabecera. Se crea la misma falla para todas.</p>
    <textarea id="csvFalla" placeholder="pérdida de imagen en pantalla superior" style="min-height:48px;margin-bottom:8px"></textarea>
    <label style="margin-top:0;font-size:13px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px">Pegar desde Excel (MDA · isla por fila)</label>
    <textarea id="excelPaste" placeholder="100011&#9;113&#10;100234&#9;045&#10;..." style="min-height:80px;margin-bottom:8px;font-family:monospace;font-size:13px"></textarea>
    <label class="btn btn-sec btn-sm" style="margin-top:0;cursor:pointer;display:inline-block">
      ↑ O subir CSV
      <input type="file" id="csvFile" accept=".csv,.txt" style="display:none">
    </label>
    <div id="csvPreview" style="margin-top:12px;font-size:13px;color:var(--muted)"></div>
    <button class="btn btn-ok" id="btnCargaMasiva" style="display:none">Crear fallas</button>`;
  body.appendChild(secMasiva);

  let csvRows=[];

  function parsearFilas(txt){
    return txt.trim().split("\n").map(l=>{
      // acepta tab (Excel), coma (CSV) o espacio como separador
      const parts=l.split(/\t|,| {2,}/).map(s=>s.trim().replace(/^"|"$/g,""));
      return{mda:mda6(parts[0]||""),isla:(parts[1]||"").replace(/\D/g,"")};
    }).filter(r=>r.mda.length===6&&r.isla);
  }

  function actualizarPreview(){
    if(!csvRows.length){$("csvPreview").textContent="";$("btnCargaMasiva").style.display="none";return;}
    $("csvPreview").innerHTML=`<b>${csvRows.length} máquinas</b>: `+csvRows.slice(0,5).map(r=>`MDA ${r.mda} isla ${r.isla}`).join(", ")+(csvRows.length>5?` y ${csvRows.length-5} más`:"");
    $("btnCargaMasiva").style.display="block";
  }

  $("excelPaste").oninput=()=>{
    csvRows=parsearFilas($("excelPaste").value);
    actualizarPreview();
  };

  $("csvFile").onchange=async(e)=>{
    const file=e.target.files[0];if(!file)return;
    const txt=await file.text();
    csvRows=parsearFilas(txt);
    actualizarPreview();
  };
  $("btnCargaMasiva").onclick=async()=>{
    const falla=$("csvFalla").value.trim();
    if(!falla){toast("Escribe la descripción de la falla");return;}
    if(!csvRows.length){toast("Sube un CSV primero");return;}
    if(!confirm(`¿Crear ${csvRows.length} fallas con "${falla}"?`))return;
    const ts=new Date().toISOString();
    const inserts=csvRows.map(r=>({mda:r.mda,isla:r.isla,falla,estado:"pendiente",tecnico,created_at:ts,updated_at:ts}));
    const{error}=await sb.from("mdas_fallas").insert(inserts);
    if(error){toast("Error: "+error.message);return;}
    audit("carga_masiva",{total:inserts.length,falla});
    toast(`${inserts.length} fallas creadas`);
    csvRows=[];$("csvPreview").textContent="";$("csvFalla").value="";$("btnCargaMasiva").style.display="none";
    cargarLista();cargarObrist();
  };

  // LISTADO PARA BORRAR
  const secBorrar=document.createElement("div");secBorrar.className="admin-section";
  secBorrar.innerHTML=`<h3>Borrar fallas</h3><div id="listaObrist"></div>`;
  body.appendChild(secBorrar);

  const lista=secBorrar.querySelector("#listaObrist");
  if(!fallas?.length){lista.innerHTML='<p style="color:var(--muted);font-size:13px">No hay fallas registradas.</p>';return;}

  fallas.forEach(f=>{
    const row=document.createElement("div");row.className="admin-item";
    const estColor={pendiente:"var(--warn)",observacion:"var(--accent)",resuelta:"var(--ok)"}[f.estado]||"var(--muted)";
    row.innerHTML=`
      <span style="flex:1">
        <b>MDA ${f.mda}</b> isla ${f.isla}<br>
        <span style="font-size:12px;color:var(--muted)">${esc(f.falla)}</span>
      </span>
      <span style="font-size:11px;color:${estColor};margin-right:8px;white-space:nowrap">${f.estado}</span>
      <button class="btn-icon btn-del" data-del="${f.id}" title="Borrar">🗑️</button>`;
    lista.appendChild(row);
  });

  lista.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    const fila=b.closest(".admin-item");
    const nombre=fila.querySelector("b").textContent;
    if(!confirm(`¿Borrar ${nombre} con todas sus acciones? Esto no se puede deshacer.`))return;
    const{error}=await sb.from("acciones").delete().eq("falla_id",b.dataset.del);
    if(!error)await sb.from("mdas_fallas").delete().eq("id",b.dataset.del);
    audit("borrar_falla",{falla_id:b.dataset.del});
    toast("Falla borrada");cargarObrist();cargarLista();
  });
}

}

// ---- NUEVA FALLA ----
$("fabNueva").onclick=()=>{$("nMda").value="";$("nIsla").value="";$("nFalla").value="";$("scrNueva").classList.remove("hidden");};
$("guardarFalla").onclick=async()=>{
  const mda=mda6($("nMda").value);
  const isla=$("nIsla").value.trim();
  const falla=$("nFalla").value.trim();
  if(mda.length!==6){toast("MDA inválido");return;}
  if(!isla){toast("Falta isla");return;}
  if(!falla){toast("Falta la falla");return;}
  const d={mda,isla,falla,estado:"pendiente",tecnico,created_at:new Date().toISOString(),updated_at:new Date().toISOString()};
  if(navigator.onLine){const{error}=await sb.from("mdas_fallas").insert(d);if(error){cola.push({t:"falla",d});guardarCola();}}
  else{cola.push({t:"falla",d});guardarCola();}
  audit("crear_falla",{mda,isla,falla});
  toast("Falla creada");$("scrNueva").classList.add("hidden");cargarLista();
};

// ---- ADMIN ----
$("btnAdmin").onclick=()=>{
  const clave=prompt("Clave admin:");
  if(clave!==claveHora()){toast("Clave incorrecta");return;}
  $("scrAdmin").classList.remove("hidden");
  cargarAdmin();
  audit("entrar_admin",{});
};

async function cargarAdmin(){
  const body=$("adminBody");body.innerHTML='<p style="color:var(--muted)">Cargando…</p>';
  const[{data:tecs},{data:cats}]=await Promise.all([
    sb.from("tecnicos").select("*").order("nombre"),
    sb.from("catalogo_acciones").select("*").order("categoria").order("accion")
  ]);
  body.innerHTML="";

  // TÉCNICOS
  const secTec=document.createElement("div");secTec.className="admin-section";
  secTec.innerHTML=`<h3>Técnicos</h3><div id="listaTec"></div>`;
  const addTecRow=document.createElement("div");addTecRow.style.display="flex";addTecRow.style.gap="8px";addTecRow.style.marginTop="12px";
  addTecRow.innerHTML=`<input id="nuevoTec" placeholder="Nombre del técnico" style="margin:0"><button class="btn btn-ok btn-sm" id="btnAddTec" style="white-space:nowrap">+ Agregar</button>`;
  secTec.appendChild(addTecRow);
  body.appendChild(secTec);

  function pintarTecs(tecs){
    const lista=$("listaTec");lista.innerHTML="";
    tecs.forEach(t=>{
      const row=document.createElement("div");row.className="admin-item";
      row.innerHTML=`<span style="${t.activo?'':'text-decoration:line-through;color:var(--muted)'}">${esc(t.nombre)}</span>
        <button class="btn-icon btn-edit" data-edit-tec="${t.id}" data-nombre="${esc(t.nombre)}">✏️</button>
        <button class="btn-icon btn-del" data-del-tec="${t.id}" data-activo="${t.activo}">${t.activo?'🗑️':'↩️'}</button>`;
      lista.appendChild(row);
    });
    lista.querySelectorAll("[data-edit-tec]").forEach(b=>b.onclick=async()=>{
      const nuevo=prompt("Nuevo nombre:",b.dataset.nombre);if(!nuevo)return;
      await sb.from("tecnicos").update({nombre:nuevo}).eq("id",b.dataset.editTec);
      audit("editar_tecnico",{id:b.dataset.editTec,nuevo});
      cargarAdmin();cargarMaestros();
    });
    lista.querySelectorAll("[data-del-tec]").forEach(b=>b.onclick=async()=>{
      const activo=b.dataset.activo==="true";
      await sb.from("tecnicos").update({activo:!activo}).eq("id",b.dataset.delTec);
      audit(activo?"desactivar_tecnico":"activar_tecnico",{id:b.dataset.delTec});
      cargarAdmin();cargarMaestros();
    });
  }
  pintarTecs(tecs||[]);
  $("btnAddTec").onclick=async()=>{
    const nombre=$("nuevoTec").value.trim();if(!nombre)return;
    await sb.from("tecnicos").insert({nombre,activo:true});
    audit("agregar_tecnico",{nombre});
    $("nuevoTec").value="";cargarAdmin();cargarMaestros();
  };

  // CATÁLOGO DE ACCIONES
  const secCat=document.createElement("div");secCat.className="admin-section";
  secCat.innerHTML=`<h3>Catálogo de acciones</h3>
    <div style="display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap">
      <input id="nuevaAcc" placeholder="Nombre de la acción" style="margin:0;flex:1;min-width:200px">
      <div style="position:relative;flex:1;min-width:150px">
        <input id="nuevaCat" placeholder="Categoría" style="margin:0;width:100%" autocomplete="off">
        <div id="catSugg" style="display:none;position:absolute;top:100%;left:0;right:0;background:var(--panel);border:1px solid var(--border);border-radius:8px;z-index:10;max-height:200px;overflow-y:auto"></div>
      </div>
      <button class="btn btn-ok btn-sm" id="btnAddAcc" style="white-space:nowrap">+ Agregar</button>
    </div>
    <div id="accPreview" style="font-size:13px;margin-bottom:8px;min-height:20px"></div>
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
      <button class="btn btn-sec btn-sm" id="btnExport" style="margin-top:0">↓ Exportar JSON</button>
      <label class="btn btn-sec btn-sm" style="margin-top:0;cursor:pointer">↑ Importar JSON<input type="file" id="btnImport" accept=".json" style="display:none"></label>
    </div>
    <div id="listaAcc"></div>`;
  body.appendChild(secCat);

  function pintarAcciones(cats){
    const lista=$("listaAcc");lista.innerHTML="";
    const grupos={};
    cats.forEach(c=>{(grupos[c.categoria]=grupos[c.categoria]||[]).push(c);});
    Object.entries(grupos).forEach(([cat,items])=>{
      const catHead=document.createElement("div");
      catHead.style.cssText="font-size:12px;font-weight:700;color:var(--muted);padding:10px 0 4px;text-transform:uppercase;letter-spacing:.5px";
      catHead.textContent=cat;lista.appendChild(catHead);
      items.forEach(c=>{
        const row=document.createElement("div");row.className="admin-item";
        row.innerHTML=`<span style="${c.activa?'':'text-decoration:line-through;color:var(--muted)'}">${esc(c.accion)}</span>
          <button class="btn-icon btn-edit" data-edit-acc="${c.id}" data-val="${esc(c.accion)}">✏️</button>
          <button class="btn-icon btn-del" data-del-acc="${c.id}" data-activa="${c.activa}">${c.activa?'🗑️':'↩️'}</button>`;
        lista.appendChild(row);
      });
    });
    lista.querySelectorAll("[data-edit-acc]").forEach(b=>b.onclick=async()=>{
      const nuevo=prompt("Nueva descripción:",b.dataset.val);if(!nuevo)return;
      await sb.from("catalogo_acciones").update({accion:nuevo}).eq("id",b.dataset.editAcc);
      audit("editar_accion_catalogo",{id:b.dataset.editAcc,nuevo});
      cargarAdmin();cargarMaestros();
    });
    lista.querySelectorAll("[data-del-acc]").forEach(b=>b.onclick=async()=>{
      const activa=b.dataset.activa==="true";
      await sb.from("catalogo_acciones").update({activa:!activa}).eq("id",b.dataset.delAcc);
      audit(activa?"desactivar_accion":"activar_accion",{id:b.dataset.delAcc});
      cargarAdmin();cargarMaestros();
    });
  }
  pintarAcciones(cats||[]);
  $("nuevaAcc").oninput=()=>{
    const q=$("nuevaAcc").value.trim().toLowerCase();
    const prev=$("accPreview");
    if(!q){prev.innerHTML="";pintarAcciones(cats||[]);return;}
    const coincidencias=cats.filter(c=>c.accion.toLowerCase().includes(q));
    if(!coincidencias.length){prev.innerHTML=`<span style="color:var(--ok)">✓ No existe en el catálogo</span>`;pintarAcciones([]);return;}
    prev.innerHTML=`<span style="color:var(--warn)">⚠ Ya existe ${coincidencias.length} coincidencia${coincidencias.length>1?"s":""}</span>`;
    pintarAcciones(coincidencias);
  };
  // categoría dinámica
  const catsList=[...new Set((cats||[]).map(c=>c.categoria))].sort();
  $("nuevaCat").oninput=()=>{
    const q=$("nuevaCat").value.trim().toLowerCase();
    const sugg=$("catSugg");
    if(!q){sugg.style.display="none";pintarAcciones(cats||[]);return;}
    // filtrar lista por categoría
    const catMatch=catsList.filter(c=>c.toLowerCase().includes(q));
    // si coincide exactamente una categoría, filtrar lista
    const exacta=catsList.find(c=>c.toLowerCase()===q);
    if(exacta)pintarAcciones((cats||[]).filter(c=>c.categoria===exacta));
    else pintarAcciones(cats||[]);
    // sugerencias dropdown
    sugg.innerHTML="";
    catMatch.forEach(c=>{
      const it=document.createElement("div");
      it.style.cssText="padding:10px 14px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--border)";
      it.textContent=c;
      it.onmousedown=()=>{$("nuevaCat").value=c;sugg.style.display="none";pintarAcciones((cats||[]).filter(x=>x.categoria===c));};
      sugg.appendChild(it);
    });
    if(!catMatch.length){
      const it=document.createElement("div");
      it.style.cssText="padding:10px 14px;cursor:pointer;font-size:14px;color:var(--ok)";
      it.textContent=`+ Crear categoría "${$("nuevaCat").value.trim()}"`;
      it.onmousedown=()=>{sugg.style.display="none";};
      sugg.appendChild(it);
    }
    sugg.style.display="block";
  };
  $("nuevaCat").onblur=()=>setTimeout(()=>$("catSugg").style.display="none",150);
  $("nuevaCat").onfocus=()=>{if($("nuevaCat").value)$("nuevaCat").oninput();};

  // export
  $("btnExport").onclick=()=>{
    const data=(cats||[]).map(c=>({categoria:c.categoria,accion:c.accion,activa:c.activa}));
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="catalogo_acciones.json";a.click();
    audit("exportar_catalogo",{total:data.length});
  };

  // import
  $("btnImport").onchange=async(e)=>{
    const file=e.target.files[0];if(!file)return;
    const txt=await file.text();
    let data;
    try{data=JSON.parse(txt);}catch{toast("JSON inválido");return;}
    if(!Array.isArray(data)||!data[0]?.accion||!data[0]?.categoria){toast("Formato incorrecto");return;}
    const existentes=new Set((cats||[]).map(c=>c.accion.toLowerCase()));
    const nuevos=data.filter(d=>!existentes.has(d.accion.toLowerCase()));
    if(!nuevos.length){toast("Ninguna acción nueva");return;}
    if(!confirm(`¿Importar ${nuevos.length} acciones nuevas?`))return;
    const{error}=await sb.from("catalogo_acciones").insert(nuevos.map(d=>({categoria:d.categoria,accion:d.accion,activa:d.activa!==false})));
    if(error){toast("Error al importar");return;}
    audit("importar_catalogo",{total:nuevos.length});
    toast(`${nuevos.length} acciones importadas`);
    cargarAdmin();cargarMaestros();
  };

  $("btnAddAcc").onclick=async()=>{
    const acc=$("nuevaAcc").value.trim();const cat=$("nuevaCat").value.trim();
    if(!acc||!cat){toast("Falta nombre o categoría");return;}
    await sb.from("catalogo_acciones").insert({categoria:cat,accion:acc,activa:true});
    audit("agregar_accion_catalogo",{accion:acc,categoria:cat});
    $("nuevaAcc").value="";cargarAdmin();cargarMaestros();
  };
}

// cerrar pantallas
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>$(b.dataset.close).classList.add("hidden"));

// cambiar usuario
$("badgeTec").onclick=()=>{
  if(confirm("¿Cambiar de técnico?")){
    audit("logout",{tecnico});
    $("app").classList.add("hidden");
    $("login").classList.remove("hidden");
    pintarLogin();
  }
};

// arranque
pintarLogin();
if(tecnico)iniciar();
</script>
</body>
</html>
