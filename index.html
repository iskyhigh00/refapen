<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fallas MDA</title>
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="appVersion" style="position:fixed;bottom:4px;right:8px;font-size:10px;color:#888;z-index:9999;pointer-events:none">v1.1</div>

<div id="login" class="login">
  <h2>Fallas MDA</h2>
  <p>¿Quién eres?</p>
  <div class="tec-grid" id="tecGrid"></div>
</div>

<div id="app" class="hidden">
  <header>
    <h1>FALLAS MDA</h1>
    <button id="btnHist">Resueltas</button>
    <button id="btnStats" class="hidden">Reportes</button>
    <button id="btnAdmin" class="hidden">Catálogo</button>
    <span id="urgenteBadge" class="urgente-badge hidden"></span>
    <div class="tecnico-badge" id="badgeTec">
      <span class="offline-dot" id="netDot"></span>
      <b id="tecNombre"></b>
      <span id="syncPill" class="sync-pill"></span>
      <span style="color:var(--muted);font-size:11px">▾</span>
    </div>
  </header>
  <main>
    <div style="padding:0 0 10px">
      <input id="buscarMda" inputmode="numeric" placeholder="Buscar MDA…" style="margin:0;padding:10px 14px;font-size:14px;border-radius:20px">
    </div>
    <div id="lista"></div>
  </main>
  <button class="fab" id="fabNueva">+</button>
</div>

<!-- NUEVA FALLA -->
<div id="scrNueva" class="screen hidden">
  <div class="screen-head">
    <button class="back-btn" data-close="scrNueva">‹ Volver</button>
    <h2>Nueva falla</h2>
  </div>
  <div class="screen-body">
    <label>MDA <span style="font-weight:400;color:var(--muted)">(100000 – 101199)</span></label>
    <input id="nMda" inputmode="numeric" maxlength="6" placeholder="100234">
    <div id="nMdaErr" style="font-size:12px;margin-top:4px;min-height:16px"></div>
    <label>Isla <span style="font-weight:400;color:var(--muted)">(100 – 700)</span></label>
    <input id="nIsla" inputmode="numeric" maxlength="3" placeholder="100">
    <div id="nIslaErr" style="font-size:12px;margin-top:4px;min-height:16px"></div>
    <label>Descripción de la falla</label>
    <textarea id="nFalla" placeholder="pérdida de imagen en pantalla superior"></textarea>
    <button class="btn" id="guardarFalla" disabled>Crear falla</button>
  </div>
</div>

<!-- HISTORIAL -->
<div id="scrHist" class="screen hidden">
  <div class="screen-head">
    <button class="back-btn" data-close="scrHist">‹ Volver</button>
    <h2>Historial de resueltas</h2>
  </div>
  <div class="screen-body" id="histBody"></div>
</div>

<!-- DETALLE MDA -->
<div id="scrMda" class="screen hidden">
  <div class="screen-head">
    <button class="back-btn" data-close="scrMda">‹ Volver</button>
    <h2 id="mdaTitulo" style="flex:1"></h2>
    <span id="mdaTecBadge" style="font-size:12px;color:var(--accent);background:var(--panel2);padding:4px 10px;border-radius:12px;border:1px solid var(--border);white-space:nowrap;cursor:pointer"></span>
  </div>
  <div class="screen-body" id="mdaBody"></div>
</div>

<!-- PANEL OBRIST -->
<div id="scrObrist" class="screen hidden">
  <div class="screen-head">
    <button class="back-btn" data-close="scrObrist">‹ Volver</button>
    <h2>Gestión</h2>
  </div>
  <div class="screen-body" id="obristBody"></div>
</div>

<!-- ESTADÍSTICAS -->
<div id="scrStats" class="screen hidden">
  <div class="screen-head">
    <button class="back-btn" data-close="scrStats">‹ Volver</button>
    <h2>Estadísticas</h2>
  </div>
  <div class="screen-body" id="statsBody"></div>
</div>

<!-- ADMIN -->
<div id="scrAdmin" class="screen hidden">
  <div class="screen-head">
    <button class="back-btn" data-close="scrAdmin">‹ Volver</button>
    <h2>Admin</h2>
  </div>
  <div class="screen-body" id="adminBody"></div>
</div>

<!-- Scripts: orden de dependencias -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/offline.js"></script>
<script src="js/login.js"></script>
<script src="js/lista.js"></script>
<script src="js/mda.js"></script>
<script src="js/historial.js"></script>
<script src="js/obrist.js"></script>
<script src="js/stats.js"></script>
<script src="js/admin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
