<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fallas MDA</title>
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="login" class="login">
  <h2>Fallas MDA</h2>
  <p>¿Quién eres?</p>
  <div class="tec-grid" id="tecGrid"></div>
</div>

<div id="app" class="hidden">
  <header>
    <h1>FALLAS MDA</h1>
    <button id="btnHist" style="background:var(--panel2);border:1px solid var(--border);color:var(--txt);padding:7px 12px;border-radius:8px;font-size:13px;cursor:pointer">Historial</button>
    <button id="btnAdmin" style="background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:7px 12px;border-radius:8px;font-size:13px;cursor:pointer">Admin</button>
    <div class="tecnico-badge" id="badgeTec">
      <span class="offline-dot" id="netDot"></span>
      <b id="tecNombre"></b>
      <span id="syncPill" class="sync-pill"></span>
      <span style="color:var(--muted);font-size:11px">▾</span>
    </div>
  </header>
  <main><div id="lista"></div></main>
  <button class="fab" id="fabNueva">+</button>
</div>

<!-- NUEVA FALLA -->
<div id="scrNueva" class="screen hidden">
  <div class="screen-head">
    <button class="back-btn" data-close="scrNueva">‹ Volver</button>
    <h2>Nueva falla</h2>
  </div>
  <div class="screen-body">
    <label>MDA (6 dígitos)</label>
    <input id="nMda" inputmode="numeric" maxlength="6" placeholder="100234">
    <label>Isla</label>
    <input id="nIsla" inputmode="numeric" placeholder="045">
    <label>Descripción de la falla</label>
    <textarea id="nFalla" placeholder="pérdida de imagen en pantalla superior"></textarea>
    <button class="btn" id="guardarFalla">Crear falla</button>
  </div>
</div>

<!-- HISTORIAL -->
<div id="scrHist" class="screen hidden">
  <div class="screen-head">
    <button class="back-btn" data-close="scrHist">‹ Volver</button>
    <h2>Historial de resueltas</h2>
  </div>
  <div class="screen-body" id="histBody"></div>
</div>

<!-- DETALLE MDA -->
<div id="scrMda" class="screen hidden">
  <div class="screen-head">
    <button class="back-btn" data-close="scrMda">‹ Volver</button>
    <h2 id="mdaTitulo"></h2>
  </div>
  <div class="screen-body" id="mdaBody"></div>
</div>

<!-- PANEL OBRIST -->
<div id="scrObrist" class="screen hidden">
  <div class="screen-head">
    <button class="back-btn" data-close="scrObrist">‹ Volver</button>
    <h2>⚡ Panel Obrist</h2>
  </div>
  <div class="screen-body" id="obristBody"></div>
</div>

<!-- ADMIN -->
<div id="scrAdmin" class="screen hidden">
  <div class="screen-head">
    <button class="back-btn" data-close="scrAdmin">‹ Volver</button>
    <h2>Admin</h2>
  </div>
  <div class="screen-body" id="adminBody"></div>
</div>

<!-- Scripts: orden de dependencias -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/offline.js"></script>
<script src="js/login.js"></script>
<script src="js/lista.js"></script>
<script src="js/mda.js"></script>
<script src="js/historial.js"></script>
<script src="js/obrist.js"></script>
<script src="js/admin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
